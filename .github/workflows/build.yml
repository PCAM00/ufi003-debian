name: Build debian

# 只做两块板子:UFI003 与 JZ02(带基带 + 1.2GHz + Adreno 306 headless GPU)
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UFI003 / JZ02 firmware (modem + 1.2GHz + headless GPU)
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          sudo apt-get -y update
          sudo apt-get -y install debootstrap debian-archive-keyring binfmt-support qemu-user-static android-sdk-libsparse-utils
          sudo apt-get -y install gcc-arm-none-eabi device-tree-compiler python3-pycryptodome curl xz-utils
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Build rootfs (ufi003)
        run: |
          cd rootfs
          sudo VARIANT=modem BOARD=ufi003 ./build.sh
          sudo xz -T0 rootfs.img
          ls -lh rootfs.img.xz verify-ufi003.txt

      - name: Build rootfs (jz02)
        run: |
          cd rootfs
          sudo VARIANT=modem BOARD=jz02 ./build.sh
          sudo xz -T0 rootfs-jz02.img
          ls -lh rootfs-jz02.img.xz verify-jz02.txt

      - name: Build bootloader (lk2nd)
        continue-on-error: true
        run: |
          cd aboot
          ./build.sh
          ls -l emmc_appsboot-test-signed.mbn

      - name: Generate release tags
        id: version
        run: |
          VER="$(cat rootfs/debian_version)"
          git tag "$VER-${{ github.run_number }}-ufi003"
          git tag "$VER-${{ github.run_number }}-jz02"
          git push origin --tags
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

      - name: 上传产物 artifact(release 失败也能取到)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufi003-${{ github.run_number }}
          path: |
            rootfs/rootfs*.img.xz
            rootfs/verify-*.txt
            rootfs/info-*.md
            kernel/boot-*.img
            aboot/emmc_appsboot-test-signed.mbn
          if-no-files-found: warn

      - name: Release ufi003
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VER }} UFI003 (modem + 1.2GHz + headless GPU)
          body_path: rootfs/info-ufi003.md
          tag_name: ${{ steps.version.outputs.VER }}-${{ github.run_number }}-ufi003
          fail_on_unmatched_files: false
          files: |
            aboot/emmc_appsboot-test-signed.mbn
            kernel/boot-ufi003-oc.img
            kernel/boot-ufi003.img
            rootfs/rootfs.img.xz
            rootfs/verify-ufi003.txt
            rootfs/info-ufi003.md

      - name: Release jz02
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VER }} JZ02 (modem + 1.2GHz + headless GPU)
          body_path: rootfs/info-jz02.md
          tag_name: ${{ steps.version.outputs.VER }}-${{ github.run_number }}-jz02
          fail_on_unmatched_files: false
          files: |
            aboot/emmc_appsboot-test-signed.mbn
            kernel/boot-jz02-oc.img
            kernel/boot-jz02.img
            rootfs/rootfs-jz02.img.xz
            rootfs/verify-jz02.txt
            rootfs/info-jz02.md
