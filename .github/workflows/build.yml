name: Build debian

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debian rootfs (nomodem + modem) + bootloader
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          sudo apt-get -y update
          sudo apt-get -y install debootstrap debian-archive-keyring binfmt-support qemu-user-static android-sdk-libsparse-utils
          sudo apt-get -y install gcc-arm-none-eabi device-tree-compiler python3-pycryptodome mkbootimg
          # 腾点磁盘(arm64 chroot 走 qemu,两套 rootfs + xz 比较吃空间)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare repository
        run: git config --global --add safe.directory "$(pwd)"

      - name: Build rootfs (nomodem)
        run: |
          cd rootfs
          sudo VARIANT=nomodem ./build.sh
          sudo xz -T0 rootfs.img
          ls -lh rootfs.img.xz verify-nomodem.txt

      - name: Build rootfs (modem)
        run: |
          cd rootfs
          sudo VARIANT=modem ./build.sh
          sudo xz -T0 rootfs-modem.img
          ls -lh rootfs-modem.img.xz verify-modem.txt

      - name: Build boot-oc-modem.img (带基带 + 1.2GHz)
        continue-on-error: true
        run: |
          sudo bash .github/build-oc-modem.sh

      - name: Build bootloader (lk2nd)
        continue-on-error: true
        run: |
          cd aboot
          ./build.sh
          ls -l emmc_appsboot-test-signed.mbn

      - name: Generate release tags
        id: version
        run: |
          VER="$(cat rootfs/debian_version)"
          TAG_NM="$VER-${{ github.run_number }}-nomodem"
          TAG_M="$VER-${{ github.run_number }}-modem"
          git tag "$TAG_NM"
          git tag "$TAG_M"
          git push origin --tags
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "TAG_NM=$TAG_NM" >> "$GITHUB_OUTPUT"
          echo "TAG_M=$TAG_M" >> "$GITHUB_OUTPUT"
          cat rootfs/info-nomodem.md

      - name: Release nomodem
        uses: softprops/action-gh-release@v2
        with:
          name: Debian ${{ steps.version.outputs.VER }} for UFI003 (no-modem, 1.2GHz OC)
          body_path: rootfs/info-nomodem.md
          tag_name: ${{ steps.version.outputs.TAG_NM }}
          fail_on_unmatched_files: false
          files: |
            aboot/emmc_appsboot-test-signed.mbn
            kernel/boot.img
            kernel/boot-no-modem-oc.img
            rootfs/rootfs.img.xz
            rootfs/verify-nomodem.txt
            rootfs/info-nomodem.md

      - name: Release modem
        uses: softprops/action-gh-release@v2
        with:
          name: Debian ${{ steps.version.outputs.VER }} for UFI003 (带基带, 1.2GHz OC)
          body_path: rootfs/info-modem.md
          tag_name: ${{ steps.version.outputs.TAG_M }}
          fail_on_unmatched_files: false
          files: |
            aboot/emmc_appsboot-test-signed.mbn
            kernel/boot-oc-modem.img
            kernel/boot-modem.img
            rootfs/rootfs-modem.img.xz
            rootfs/verify-modem.txt
            rootfs/info-modem.md
